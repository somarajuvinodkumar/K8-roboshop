---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user
  namespace: roboshop
  labels:
    component: user
    projcet: roboshop
    tier: app
data:
  MONGO_URL: mongodb://mongodb:27017/users
  REDIS_URL: redis://redis:6379
  MONGO: "true"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop
  labels:
    component: user
    projcet: roboshop
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      component: user
      projcet: roboshop
      tier: app
  template:
    metadata:
      labels:
        component: user
        projcet: roboshop
        tier: app
    spec:
      containers:
        - name: user
          image: vinodkumar9618/user:v1
          envFrom:
            - configMapRef:
                name: user

---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: roboshop
  labels:
    component: user
    projcet: roboshop
    tier: app
spec:
  selector:
    component: user
    projcet: roboshop
    tier: app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
